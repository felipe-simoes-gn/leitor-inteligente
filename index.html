:root{
  --verde:#2FD68B;--marinho:#14315E;--azul:#2151FF;--ciano:#01A9F4;--menta:#87E6BC;
  --bg:#F0F4FA;--surface:#FFFFFF;--paper:#FFFFFF;--ink:#14315E;--muted:#5A6C8A;--line:#D9E2EF;
  --brand:#14315E;--on-brand:#FFFFFF;--accent:#2151FF;--tint:#E3F8EE;--ok:#0C8F58;--warn:#A86200;--danger:#D0364A;
  --grad:linear-gradient(118deg,#14315E 0%,#14315E 38%,#1C7F7C 76%,#2FD68B 108%);
  --grad-go:linear-gradient(118deg,#2FD68B 0%,#87E6BC 100%);
  --shadow:0 6px 20px rgba(20,49,94,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#091630;--surface:#11254A;--paper:#152C57;--ink:#F1F5FF;--muted:#9DB0CF;--line:#263F72;
  --brand:#2FD68B;--on-brand:#091630;--accent:#7FC4FF;--tint:#14394A;--ok:#2FD68B;--warn:#FFC266;--danger:#FF8090;
  --shadow:0 6px 20px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#091630;--surface:#11254A;--paper:#152C57;--ink:#F1F5FF;--muted:#9DB0CF;--line:#263F72;
  --brand:#2FD68B;--on-brand:#091630;--accent:#7FC4FF;--tint:#14394A;--ok:#2FD68B;--warn:#FFC266;--danger:#FF8090;
  --shadow:0 6px 20px rgba(0,0,0,.35);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#14315E}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--grad);color:#fff;overflow:hidden}
header .deco{position:absolute;right:-30px;top:-46px;width:190px;height:190px;pointer-events:none}
.hrow{position:relative;display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto;padding:11px 16px 12px}
#brand{flex:none;height:44px;min-width:44px;max-width:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14)}
#brand.logo{background:#fff;padding:5px 9px}
#brand img{max-height:34px;max-width:102px;display:block}
#brand svg{width:26px;height:26px}
.htxt{min-width:0;flex:1}
.htxt p{margin:0;font-size:13px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htxt h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{max-width:560px;margin:0 auto;padding:16px 16px 92px}
main.comdock{padding-bottom:176px}
h2{font-size:16px;margin:24px 0 8px;font-weight:650;letter-spacing:-.01em}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--muted);text-decoration:none}
nav a span{display:flex;align-items:center;justify-content:center;width:54px;height:28px;border-radius:14px}
nav a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--ink);font-weight:650}
nav a[aria-current="page"] span{background:var(--verde);color:#14315E}

#dock{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:6;padding:18px 16px 12px;background:linear-gradient(to top,var(--bg) 62%,transparent)}
#dock div{max-width:528px;margin:0 auto;display:flex;gap:10px}
#dock button{min-height:64px;border:0;border-radius:18px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow)}
.dfin{flex:1;background:var(--brand);color:var(--on-brand);flex-direction:column;gap:0!important;line-height:1.15;font-size:14px}
.dfin b{font-size:19px}
.dfin:disabled{opacity:.5;box-shadow:none!important}
.dscan{flex:1.25;background:var(--grad-go);color:#14315E;font-size:18px}
.dscan svg{width:30px;height:30px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.go{background:var(--grad-go);color:#14315E;border-color:transparent}
.btn.block{width:100%}
.btn.text{border-color:transparent;background:none;color:var(--muted);min-height:42px}
.btn.danger{color:var(--danger)}
.btn.small{min-height:42px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45}
.actions{display:grid;gap:8px;margin-top:20px}
.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

input[type=text],input[type=date],textarea{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px}
textarea{padding:12px 14px;min-height:230px;line-height:1.45;resize:vertical}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.busca{position:relative}
.busca input{padding-left:44px}
.busca>svg{position:absolute;left:14px;top:14px;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
#res{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.sw{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.sw .g{flex:1}.sw small{display:block;color:var(--muted);font-size:13px}
.sw i{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"] i{background:var(--verde)}
.sw[aria-checked="true"] i::after{transform:translateX(18px)}

.th{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--tint);display:flex;align-items:center;justify-content:center}
.th svg{width:22px;height:22px;stroke:var(--ok);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.th.big{width:72px;height:72px;border-radius:16px}
.th.big svg{width:34px;height:34px}

.receipt{position:relative;margin-top:16px;background:var(--paper);border-radius:16px 16px 0 0;padding:16px 14px 24px;box-shadow:var(--shadow)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:linear-gradient(-45deg,var(--bg) 5px,transparent 0),linear-gradient(45deg,var(--bg) 5px,transparent 0);background-size:10px 10px;background-repeat:repeat-x;background-position:left bottom}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.rhead b{font-size:21px;font-weight:650;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:10px 0}
.row .g{flex:1;min-width:0}
.row .d{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.row .t{font-weight:650;text-align:right}
.row .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.cli{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 0;background:none;border:0;border-bottom:1px dashed var(--line);text-align:left;font-size:14px;color:var(--muted)}
.cli b{color:var(--accent);font-weight:600}
.rtotal{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;font-size:15px}
.rtotal b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.empty{color:var(--muted);padding:18px 0 4px;margin:0}
.tag{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--tint);color:var(--ok);font-size:12px;font-weight:650}
.tag.aberto{color:var(--warn)}.tag.cancelado{color:var(--danger)}.tag.pag{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.item:last-child{border-bottom:0}
.item .g{flex:1;min-width:0}
.item .g b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:13px}
.item .v{font-weight:650;text-align:right;white-space:nowrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:12px 0 0;font-size:15px}
dt{color:var(--muted)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}

.welcome{text-align:center;padding:26px 18px}
.welcome svg{width:150px;height:120px}
.welcome b{display:block;font-size:22px;font-weight:650;letter-spacing:-.01em;margin-top:6px}

.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:20px;padding:18px 18px 20px;box-shadow:var(--shadow)}
.hero small{font-size:14px;opacity:.85}
.hero .big{display:block;font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.hero .deco{position:absolute;right:-40px;bottom:-70px;width:200px;height:200px;pointer-events:none}
.meta{position:relative;margin-top:14px}
.meta .trk{height:10px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.meta .trk i{display:block;height:100%;border-radius:5px;background:#fff}
.meta p{margin:6px 0 0;font-size:14px;opacity:.92}
.hero button{position:relative;margin-top:12px;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.stats small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.stats b{font-size:19px;font-weight:650;letter-spacing:-.01em}
.bar{display:grid;grid-template-columns:104px 1fr auto;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--azul),var(--ciano));min-width:4px}
.bar.v i{background:linear-gradient(90deg,#1C7F7C,var(--verde))}
.bar span:last-child{font-weight:600}
.cols{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.cols i{display:block;width:100%;max-width:34px;border-radius:7px 7px 2px 2px;background:var(--menta);min-height:3px}
.cols .pico i{background:linear-gradient(180deg,var(--verde),#1C7F7C)}
.cols .pico{color:var(--ink);font-weight:650}

.backdrop{position:fixed;inset:0;z-index:20;background:rgba(9,22,48,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:-.01em}
.phead{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.phead .g{min-width:0}.phead small{color:var(--muted);font-size:14px}
.bigtotal{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:2px 0 6px}
.troco{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:var(--tint);font-weight:600;display:flex;justify-content:space-between}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{flex:none;width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600}
.stepper input{text-align:center;font-weight:650;font-size:18px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:transparent}
.festa{text-align:center;padding:10px 6px 0}
.festa svg{width:92px;height:92px}
.festa b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px}

#cam{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam .aim{position:absolute;left:8%;right:8%;top:34%;height:22%;border:3px solid #2FD68B;border-radius:18px;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
#cam .aim::after{content:"";position:absolute;left:5%;right:5%;top:50%;height:2px;background:#FF4B55;box-shadow:0 0 10px #FF4B55}
#camTop{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;margin:0;text-align:center;font-weight:600;text-shadow:0 1px 4px #000}
#camFlash{position:absolute;left:16px;right:16px;top:60%;padding:12px 14px;border-radius:16px;background:#2FD68B;color:#14315E;font-weight:650;display:flex;justify-content:space-between;gap:10px}
#camFlash span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#camInfo{margin:0;padding:12px 16px 0;background:#000;font-size:15px;display:flex;justify-content:space-between}
#cam .bar2{display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#000}
#cam .bar2 button{flex:1;min-height:54px;border-radius:14px;border:1px solid #555;background:#1b1b1b;color:#fff;font-weight:600}
#cam .bar2 .pronto{background:#2FD68B;color:#14315E;border-color:transparent}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:#14315E;color:#fff;padding:11px 18px;border-radius:14px;font-size:15px;max-width:90%;text-align:center;box-shadow:var(--shadow)}
#confete{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
#confete i{position:absolute;top:-24px;border-radius:2px;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(112vh) rotate(700deg)}}
@media (prefers-reduced-motion:reduce){.sw i,.sw i::after{transition:none}}
</style>
</head>
<body>
<header>
  <svg class="deco" viewBox="0 0 200 200" fill="none" stroke="#fff" aria-hidden="true"><circle cx="100" cy="100" r="96" opacity=".10" stroke-width="2"/><circle cx="100" cy="100" r="70" opacity=".14" stroke-width="2"/><circle cx="100" cy="100" r="44" opacity=".18" stroke-width="2"/><circle cx="100" cy="100" r="18" fill="#fff" stroke="none" opacity=".12"/></svg>
  <div class="hrow"><div id="brand"></div><div class="htxt"><p id="hHello"></p><h1 id="hTitle">Venda Externa</h1><p id="hSub"></p></div></div>
</header>
<main id="main">
  <section id="v-venda"></section>
  <section id="v-cupons" hidden></section>
  <section id="v-painel" hidden></section>
  <section id="v-acao" hidden></section>
</main>
<div id="dock" hidden></div>
<nav>
  <a href="#venda"><span><svg viewBox="0 0 24 24"><path d="M4 6v12M7 6v12M11 6v12M14 6v12M17 6v12M20 6v12"/></svg></span>Venda</a>
  <a href="#cupons"><span><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></span>Cupons</a>
  <a href="#painel"><span><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Painel</a>
  <a href="#acao"><span><svg viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg></span>Ação</a>
</nav>

<div class="backdrop" id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="cam" hidden>
  <p id="camTop">Aponte para o código de barras</p>
  <video id="video" playsinline muted></video><div class="aim"></div>
  <div id="camFlash" hidden><span></span><span class="num"></span></div>
  <p id="camInfo" class="num"><span></span><b></b></p>
  <div class="bar2"><button data-act="torch" id="btnTorch" hidden>Lanterna</button><button data-act="camManual">Digitar</button><button class="pronto" data-act="camClose">Pronto</button></div>
</div>
<div id="toast" hidden role="status"></div>
<div id="confete" aria-hidden="true"></div>
<input type="file" id="fileProdutos" accept=".xlsx,.xls,.xlsm,.ods,.csv,.txt" hidden>
<input type="file" id="fileLojas" accept=".xlsx,.xls,.xlsm,.ods,.csv,.txt" hidden>
<input type="file" id="fileLogo" accept="image/*" hidden>

<script>
(function(){
'use strict';
var LIB={zxing:'zxing.min.js',xlsx:'xlsx.min.js'};
var APP_INSTALAVEL=true;
var KEY='vendaExterna.v1',KEY_T='vendaExterna.tabelas.v1',KEY_LOGO='vendaExterna.logo.v1';
var DESCONTOS=['VP','BW','BT','BP','VIC'],PAGAMENTOS=['Dinheiro','Pix','Débito','Crédito'],VIEWS=['venda','cupons','painel','acao'];
var S={acoes:[],acaoId:null,cupomId:null,cfg:{rapido:false,som:true,pag:''}};
var T={produtos:{},lojas:{}},LOGO='',IDX=[];
(function carregar(){
  var p=null,t=null;
  try{p=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  try{t=JSON.parse(localStorage.getItem(KEY_T)||'null');}catch(e){}
  try{LOGO=localStorage.getItem(KEY_LOGO)||'';}catch(e){}
  if(p&&p.acoes){S.acoes=p.acoes;S.acaoId=p.acaoId||null;S.cupomId=p.cupomId||null;if(p.cfg)for(var k in p.cfg)S.cfg[k]=p.cfg[k];}
  if(t&&t.produtos){T.produtos=t.produtos;T.lojas=t.lojas||{};}
  else if(p){ /* migra as tabelas da versão anterior */
    if(p.produtos)for(var c in p.produtos)T.produtos[c]={n:p.produtos[c].descricao||'',p:p.produtos[c].preco};
    if(p.lojas)T.lojas=p.lojas;
  }
})();
function gravar(k,v){try{localStorage.setItem(k,v);return true;}catch(e){toast('Sem espaço para salvar neste aparelho. Exporte os cupons agora.');return false;}}
function save(){gravar(KEY,JSON.stringify({acoes:S.acoes,acaoId:S.acaoId,cupomId:S.cupomId,cfg:S.cfg}));}
function saveT(){gravar(KEY_T,JSON.stringify(T));reindex();}

var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function brl(n){return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function pad(n){return String(n).padStart(3,'0');}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function parsePreco(s){if(typeof s==='number')return s;s=String(s==null?'':s).trim().replace(/[^\d.,-]/g,'');if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isFinite(n)?n:NaN;}
function sku(v){v=String(v==null?'':v).trim();return /^\d{7,}$/.test(v)?v.slice(-6,-1):v;}
function hoje(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dataBR(iso){if(!iso)return '';var p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function hora(ts){return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function acao(){for(var i=0;i<S.acoes.length;i++)if(S.acoes[i].id===S.acaoId)return S.acoes[i];return null;}
function cupom(){var a=acao();if(!a)return null;for(var i=0;i<a.cupons.length;i++)if(a.cupons[i].id===S.cupomId)return a.cupons[i];return null;}
function totalCupom(c){return c.itens.reduce(function(t,i){return t+i.qtd*i.preco;},0);}
function unidades(c){return c.itens.reduce(function(t,i){return t+i.qtd;},0);}
function reindex(){IDX=Object.keys(T.produtos).map(function(k){return {k:k,n:norm(T.produtos[k].n)};});}
reindex();
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3000);}

var ICO_TAG='<svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>';
var ICO_SCAN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M14 8v8M17 8v8"/></svg>';
function thumb(cod,big){
  var p=T.produtos[cod],f=p&&p.f,cls='th'+(big?' big':'');
  if(f&&(/^data:image\//i.test(f)||(APP_INSTALAVEL&&/^https?:\/\//i.test(f))))return '<img class="'+cls+'" src="'+esc(f)+'" alt="" loading="lazy">';
  return '<span class="'+cls+'">'+ICO_TAG+'</span>';
}
document.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&t.classList.contains('th')){var s=document.createElement('span');s.className=t.className;s.innerHTML=ICO_TAG;t.replaceWith(s);}},true);

/* ---------- cabeçalho e navegação ---------- */
function view(){var h=location.hash.slice(1);return VIEWS.indexOf(h)>=0?h:'venda';}
function saudacao(a){var h=new Date().getHours(),s=h<12?'Bom dia':(h<18?'Boa tarde':'Boa noite');var n=a&&a.gerente?String(a.gerente).trim().split(/\s+/)[0]:'';return n?s+', '+n:s;}
function render(){
  var v=view(),a=acao();
  VIEWS.forEach(function(n){$('#v-'+n).hidden=n!==v;});
  document.querySelectorAll('nav a').forEach(function(l){if(l.getAttribute('href')==='#'+v)l.setAttribute('aria-current','page');else l.removeAttribute('aria-current');});
  var b=$('#brand');
  if(LOGO){b.className='logo';b.innerHTML='<img src="'+esc(LOGO)+'" alt="Logo da marca">';}
  else{b.className='';b.innerHTML=ICO_SCAN;}
  $('#hHello').textContent=saudacao(a);
  $('#hTitle').textContent=a?a.nome:'Venda Externa';
  $('#hSub').textContent=a?[a.loja||('BCPS '+a.bcps),a.praca,dataBR(a.data)].filter(Boolean).join(', '):'Nenhuma ação aberta';
  ({venda:renderVenda,cupons:renderCupons,painel:renderPainel,acao:renderAcao})[v]();
  renderDock(v,a);
}
window.addEventListener('hashchange',function(){window.scrollTo(0,0);render();});

function semAcao(){
  return '<div class="card welcome"><svg viewBox="0 0 150 120" fill="none" aria-hidden="true"><circle cx="75" cy="62" r="52" fill="#87E6BC" opacity=".35"/><path d="M44 46h62l-6 58H50z" fill="#14315E"/><path d="M60 46V36a15 15 0 0 1 30 0v10" stroke="#2FD68B" stroke-width="5" stroke-linecap="round"/><path d="M60 64v24M66 64v24M74 64v24M79 64v24M86 64v24M91 64v24" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M118 22l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM26 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#2151FF"/><circle cx="124" cy="78" r="4" fill="#01A9F4"/></svg>'+
    '<b>Vamos abrir a ação de hoje</b><p class="note">Informe o nome da ação, a empresa, o BCPS e a data. Depois é só ler os códigos e finalizar os cupons.</p><div class="actions"><button class="btn go block" data-act="novaAcao">Criar ação</button></div></div>';
}

/* ---------- venda ---------- */
function renderVenda(){
  var a=acao(),el=$('#v-venda');
  if(!a){el.innerHTML=semAcao();return;}
  var c=cupom(),h='',travado=c&&c.status==='cancelado';
  if(!travado){
    h+='<div class="busca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="text" id="busca" autocomplete="off" placeholder="Digite o código ou o nome do produto" aria-label="Buscar produto por código ou nome"></div><div id="res" hidden></div>';
    h+='<button class="sw" role="switch" data-act="rapido" aria-checked="'+(!!S.cfg.rapido)+'"><span class="g"><b>Modo rápido</b><small>A câmera fica aberta e o produto com preço na planilha entra direto no cupom.</small></span><i></i></button>';
  }
  h+='<div class="receipt">';
  if(!c){
    h+='<div class="rhead"><b>Cupom '+pad(a.seq)+'</b><span class="tag">novo</span></div><p class="empty">Leia ou digite o primeiro código para abrir este cupom.</p>';
  }else{
    h+='<div class="rhead"><b>Cupom '+pad(c.num)+'</b><span class="tag '+c.status+'">'+c.status+'</span></div>';
    h+='<button class="cli num" data-act="cliente"'+(travado?' disabled':'')+'><span>'+(c.cpf||c.tel?'Cliente: '+esc([c.cpf,c.tel].filter(Boolean).join(', ')):'Cliente sem CPF e telefone')+'</span><b>'+(c.cpf||c.tel?'Editar':'Adicionar')+'</b></button>';
    if(!c.itens.length)h+='<p class="empty">Cupom sem itens.</p>';
    c.itens.forEach(function(i){
      h+='<button class="row" data-act="editItem" data-id="'+i.id+'"'+(travado?' disabled':'')+'>'+thumb(i.codigo)+'<span class="g"><span class="d">'+esc(i.descricao||('Produto '+i.codigo))+'</span><span class="s num"><span>'+esc(i.codigo)+'</span>'+(i.desconto?'<span class="tag">'+esc(i.desconto)+'</span>':'')+'</span></span>'+
         '<span class="t num">'+brl(i.qtd*i.preco)+'<small>'+i.qtd+' × '+brl(i.preco)+'</small></span></button>';
    });
    h+='<div class="rtotal"><span>'+unidades(c)+' itens</span><b class="num">'+brl(totalCupom(c))+'</b></div>';
  }
  h+='</div>';
  if(c&&c.status!=='cancelado')h+='<div class="actions"><button class="btn text danger" data-act="cancelarCupom">Cancelar cupom</button></div>';
  if(travado)h+='<div class="actions"><button class="btn primary block" data-act="reativar">Reativar cupom</button><button class="btn text" data-act="concluirEdicao">Voltar aos cupons</button></div>';
  el.innerHTML=h;
}
function renderDock(v,a){
  var d=$('#dock'),c=cupom(),mostra=v==='venda'&&a&&!(c&&c.status==='cancelado');
  d.hidden=!mostra;$('#main').className=mostra?'comdock':'';
  if(!mostra)return;
  var esq=c&&c.status==='finalizado'
    ?'<button class="dfin" data-act="concluirEdicao"><span>Concluir edição</span><b class="num">'+brl(totalCupom(c))+'</b></button>'

/* ---------- item ---------- */
var itemCtx=null;
function garanteCupom(){var a=acao(),c=cupom();if(!c){c={id:uid(),num:a.seq++,status:'aberto',criadoEm:Date.now(),itens:[]};a.cupons.push(c);S.cupomId=c.id;}return c;}
function soma(c,cod,desc,preco,qtd,desconto){
  for(var i=0;i<c.itens.length;i++){var x=c.itens[i];if(x.codigo===cod&&x.preco===preco&&x.desconto===desconto){x.qtd+=qtd;return;}}
  c.itens.push({id:uid(),codigo:cod,descricao:desc,preco:preco,qtd:qtd,desconto:desconto});
}

    '<div class="two"><div><label for="fCod">Código</label><input type="text" id="fCod" inputmode="numeric" autocomplete="off" value="'+esc(d.codigo)+'"></div>'+
    '<div><label for="fPreco">Valor unitário (R$)</label><input type="text" id="fPreco" inputmode="decimal" autocomplete="off" placeholder="0,00" value="'+(d.preco!=null?d.preco.toFixed(2).replace('.',','):'')+'"></div></div>'+
    '<label for="fDesc">Nome do produto</label><input type="text" id="fDesc" autocomplete="off" value="'+esc(d.descricao)+'">'+
    '<label for="fQtd">Quantidade</label><div class="stepper"><button data-act="qtd" data-d="-1" aria-label="Diminuir">−</button><input type="text" id="fQtd" inputmode="numeric" value="'+d.qtd+'"><button data-act="qtd" data-d="1" aria-label="Aumentar">+</button></div>'+
    '<label>Desconto</label><div class="chips" id="chips">'+chips+'</div>'+

function salvarItem(proximo){
  var cod=$('#fCod').value.trim(),preco=parsePreco($('#fPreco').value),qtd=parseInt($('#fQtd').value,10),desc=$('#fDesc').value.trim();
  if(!cod){toast('Informe o código do produto.');return;}
  if(isNaN(preco)||preco<0){toast('Informe o valor unitário.');$('#fPreco').focus();return;}
  if(!(qtd>=1)){toast('A quantidade precisa ser 1 ou mais.');return;}
  preco=Math.round(preco*100)/100;
  var c=garanteCupom();
  if(itemCtx.id){c.itens.forEach(function(it){if(it.id===itemCtx.id){it.codigo=cod;it.descricao=desc;it.preco=preco;it.qtd=qtd;it.desconto=itemCtx.desconto;}});}
  else soma(c,cod,desc,preco,qtd,itemCtx.desconto);
  var p=T.produtos[cod];
  if(!p){T.produtos[cod]={n:desc,p:preco};saveT();}
  else if(p.p==null||(!p.n&&desc)){if(p.p==null)p.p=preco;if(!p.n)p.n=desc;saveT();}
  save();closeSheet();render();
  if(proximo)abrirCamera();
}

/* ---------- cliente ---------- */
function mCpf(v){var d=String(v||'').replace(/\D/g,'').slice(0,11),o=d.slice(0,3);if(d.length>3)o+='.'+d.slice(3,6);if(d.length>6)o+='.'+d.slice(6,9);if(d.length>9)o+='-'+d.slice(9);return o;}
function mTel(v){var d=String(v||'').replace(/\D/g,'').slice(0,11);if(d.length<3)return d;var o='('+d.slice(0,2)+') ';if(d.length<=10){o+=d.slice(2,6);if(d.length>6)o+='-'+d.slice(6);}else o+=d.slice(2,7)+'-'+d.slice(7);return o;}
function cpfOk(v){v=String(v).replace(/\D/g,'');if(v.length!==11||/^(\d)\1{10}$/.test(v))return false;for(var t=9;t<11;t++){var s=0;for(var i=0;i<t;i++)s+=(+v[i])*(t+1-i);if((s*10)%11%10!==+v[t])return false;}return true;}
function camposCliente(c){return '<div class="two"><div><label for="fCpf">CPF do cliente (opcional)</label><input type="text" id="fCpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" value="'+esc(c.cpf||'')+'"></div><div><label for="fTel">Telefone (opcional)</label><input type="text" id="fTel" inputmode="tel" autocomplete="off" placeholder="(00) 00000-0000" value="'+esc(c.tel||'')+'"></div></div>';}
function lerCliente(c){
  var cpf=$('#fCpf').value.trim(),tel=$('#fTel').value.trim(),nt=tel.replace(/\D/g,'').length;
  if(cpf&&!cpfOk(cpf)){toast('CPF inválido. Confira os números ou deixe em branco.');$('#fCpf').focus();return false;}
  if(tel&&nt!==10&&nt!==11){toast('Telefone incompleto. Informe o DDD e o número.');$('#fTel').focus();return false;}
  c.cpf=cpf;c.tel=tel;return true;
}
function abrirCliente(){var c=cupom();if(!c)return;openSheet('<h3>Cliente do cupom '+pad(c.num)+'</h3>'+camposCliente(c)+'<div class="actions"><button class="btn primary block" data-act="salvarCliente">Salvar cliente</button><button class="btn text" data-act="fechar">Voltar</button></div>');}

/* ---------- números da ação ---------- */
function calc(a){
  var r={fin:0,abertos:0,total:0,un:0,maior:0,desc:{},pag:{},prod:{},hora:{}};
  a.cupons.forEach(function(c){
    if(c.status==='aberto')r.abertos++;
    if(c.status!=='finalizado')return;
    r.fin++;var tc=totalCupom(c);r.total+=tc;if(tc>r.maior)r.maior=tc;
    var pg=c.pagamento||'Não informado';r.pag[pg]=r.pag[pg]||{v:0,q:0};r.pag[pg].v+=tc;r.pag[pg].q++;
    var h=new Date(c.finalizadoEm||c.criadoEm).getHours();r.hora[h]=(r.hora[h]||0)+tc;
    c.itens.forEach(function(i){
      var v=i.qtd*i.preco;r.un+=i.qtd;
      var k=i.desconto||'Sem desconto';r.desc[k]=r.desc[k]||{v:0,q:0};r.desc[k].v+=v;r.desc[k].q+=i.qtd;
      r.prod[i.codigo]=r.prod[i.codigo]||{n:i.descricao||('Produto '+i.codigo),v:0,q:0};r.prod[i.codigo].v+=v;r.prod[i.codigo].q+=i.qtd;
    });
  });
  r.ticket=r.fin?r.total/r.fin:0;
  r.top=Object.keys(r.prod).sort(function(x,y){return r.prod[y].q-r.prod[x].q||r.prod[y].v-r.prod[x].v;});
  r.pico=null;Object.keys(r.hora).forEach(function(h){if(r.pico===null||r.hora[h]>r.hora[r.pico])r.pico=h;});
  return r;
}

/* ---------- cupons ---------- */
function renderCupons(){
  var a=acao(),el=$('#v-cupons');
  if(!a){el.innerHTML=semAcao();return;}
  var h='<div class="actions" style="margin-top:0"><button class="btn primary block" data-act="exportar"'+(a.cupons.length?'':' disabled')+'>Exportar cupons (CSV)</button><button class="btn block" data-act="resumo"'+(a.cupons.length?'':' disabled')+'>Resumo da ação para enviar</button></div>';
  if(!a.cupons.length)h+='<p class="note">Nenhum cupom nesta ação. Eles aparecem aqui assim que o primeiro item é lançado.</p>';
  else{
    h+='<h2>'+a.cupons.length+(a.cupons.length===1?' cupom':' cupons')+' nesta ação</h2><div class="list">';
    a.cupons.slice().reverse().forEach(function(c){
      h+='<button class="item" data-act="abrirCupom" data-id="'+c.id+'"><span class="g"><b>Cupom '+pad(c.num)+'</b><small class="num">'+hora(c.criadoEm)+', '+unidades(c)+' itens '+(c.status!=='finalizado'?'<span class="tag '+c.status+'">'+c.status+'</span>':'')+(c.pagamento?' <span class="tag pag">'+esc(c.pagamento)+'</span>':'')+'</small></span><span class="v num">'+brl(totalCupom(c))+'</span></button>';
    });
    h+='</div><p class="note">Toque em um cupom para acrescentar ou retirar itens.</p>';
  }
  el.innerHTML=h;
}
function csvCell(v){v=String(v==null?'':v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function dec(n){return n.toFixed(2).replace('.',',');}
function exportar(){
  var a=acao();if(!a)return;
  var L=[['acao','empresa','bcps','loja','praca','gerente','data_acao','cupom','status','hora','pagamento','cpf_cliente','telefone_cliente','sku','nome','quantidade','valor_unitario','desconto','total_item']];
  a.cupons.forEach(function(c){c.itens.forEach(function(i){
    L.push([a.nome,a.empresa,a.bcps,a.loja,a.praca,a.gerente,dataBR(a.data),pad(c.num),c.status,hora(c.criadoEm),c.pagamento||'',c.cpf||'',c.tel||'',i.codigo,i.descricao,i.qtd,dec(i.preco),i.desconto,dec(i.qtd*i.preco)]);
  });});
  baixar(('vendas_'+a.nome+'_'+a.data).replace(/[^\w\-]+/g,'_')+'.csv','\uFEFF'+L.map(function(r){return r.map(csvCell).join(';');}).join('\r\n'));
}
function baixar(nome,texto){
  function local(){try{var u=URL.createObjectURL(new Blob([texto],{type:'text/csv;charset=utf-8'}));var l=document.createElement('a');l.href=u;l.download=nome;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast('Arquivo gerado: '+nome);}catch(e){toast('Não foi possível gerar o arquivo neste aparelho.');}}
  try{var arq=new File([texto],nome,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[arq]})){navigator.share({files:[arq],title:nome}).catch(function(e){if(!e||e.name!=='AbortError')local();});return;}}catch(e){}
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(d){
      if(!d){local();return;}
      d.save({filename:nome,data:texto}).then(function(){toast('Arquivo exportado.');},function(e){toast(e&&e.code==='declined'?'Exportação cancelada.':'Não foi possível exportar agora.');});
    },local);
  }else local();
}
function textoResumo(a){
  var r=calc(a),L=[];
  L.push('*Resumo da ação: '+a.nome+'*');
  L.push([a.empresa,dataBR(a.data)].filter(Boolean).join(', '));
  if(a.loja||a.bcps)L.push('Loja: '+[a.loja,a.bcps?'BCPS '+a.bcps:'',a.praca].filter(Boolean).join(', '));
  if(a.gerente)L.push('Gerente: '+a.gerente);
  L.push('');
  L.push('Total vendido: '+brl(r.total));
  if(a.meta)L.push('Meta: '+brl(a.meta)+' ('+Math.round(r.total/a.meta*100)+'% atingido)');
  L.push('Cupons: '+r.fin+', itens: '+r.un);
  L.push('Ticket médio: '+brl(r.ticket));
  if(r.pico!==null)L.push('Hora de pico: '+r.pico+'h ('+brl(r.hora[r.pico])+')');
  var pg=Object.keys(r.pag).filter(function(k){return k!=='Não informado';});
  if(pg.length){L.push('');L.push('Pagamentos:');pg.forEach(function(k){L.push('- '+k+': '+brl(r.pag[k].v));});}
  var ds=DESCONTOS.filter(function(k){return r.desc[k];});
  if(ds.length){L.push('');L.push('Descontos:');ds.forEach(function(k){L.push('- '+k+': '+r.desc[k].q+' itens, '+brl(r.desc[k].v));});}
  if(r.top.length){L.push('');L.push('Mais vendidos:');r.top.slice(0,5).forEach(function(k,i){L.push((i+1)+'. '+r.prod[k].n+' ('+r.prod[k].q+' un.)');});}
  if(r.abertos){L.push('');L.push('Obs.: '+r.abertos+' cupom(ns) ainda em aberto, fora destes números.');}
  return L.join('\n');
}
function abrirResumo(){
  var a=acao();if(!a)return;
  openSheet('<h3>Resumo da ação</h3><p class="note" style="margin:0 0 10px">Pronto para colar no WhatsApp ou no e-mail. Dá para ajustar o texto antes de enviar.</p><textarea id="resumoTxt" aria-label="Texto do resumo">'+esc(textoResumo(a))+'</textarea>'+

}

/* ---------- painel ---------- */
function barras(obj,keys,cls,rot){
  var max=Math.max.apply(null,keys.map(function(k){return obj[k]?obj[k].v:0;}))||1,s='';
  keys.forEach(function(k){var o=obj[k];if(!o)return;s+='<div class="bar '+(cls||'')+'"><span>'+esc(k)+'</span><span><i style="width:'+Math.max(3,o.v/max*100)+'%"></i></span><span class="num">'+brl(o.v)+' <small>('+o.q+rot+')</small></span></div>';});
  return s;
}
function renderPainel(){

  var h='<div class="hero"><svg class="deco" viewBox="0 0 200 200" fill="none" stroke="#fff" aria-hidden="true"><circle cx="100" cy="100" r="96" opacity=".12" stroke-width="2"/><circle cx="100" cy="100" r="66" opacity=".16" stroke-width="2"/><circle cx="100" cy="100" r="36" opacity=".2" stroke-width="2"/></svg><small>Total vendido na ação</small><span class="big num">'+brl(r.total)+'</span>';

  }else h+='<br><button data-act="editarAcao">Definir uma meta para a ação</button>';
  h+='</div><div class="stats"><div><small>Cupons</small><b class="num">'+r.fin+'</b></div><div><small>Itens</small><b class="num">'+r.un+'</b></div><div><small>Ticket médio</small><b class="num">'+brl(r.ticket)+'</b></div></div>';
  if(r.abertos)h+='<p class="note">'+r.abertos+' cupom(ns) em aberto ainda não entram nestes números.</p>';

  var hs=Object.keys(r.hora).map(Number).sort(function(x,y){return x-y;}),ini=hs[0],fim=hs[hs.length-1],mx=r.hora[r.pico];

/* leitura de planilhas (Excel ou CSV) */
function carregarLib(nome,global){return new Promise(function(ok,no){if(window[global])return ok();var s=document.createElement('script');s.src=LIB[nome];s.onload=function(){ok();};s.onerror=function(){no(new Error('lib'));};document.head.appendChild(s);});}
function parseCsv(txt){
  txt=String(txt).replace(/^\uFEFF/,'');
  var first=txt.split(/\r?\n/)[0]||'',sep=first.indexOf(';')>=0?';':(first.indexOf('\t')>=0?'\t':','),rows=[],row=[],cur='',q=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(ch!=='\r')cur+=ch;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function lerPlanilha(file,cb){
  function fim(rows){rows=rows.filter(function(r){return r.some(function(c){return String(c==null?'':c).trim()!=='';});});if(!rows.length){toast('A planilha está vazia.');return;}cb(rows);}
  if(/\.(xlsx|xls|xlsm|ods)$/i.test(file.name)){
    toast('Lendo a planilha…');
    carregarLib('xlsx','XLSX').then(function(){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result);};r.onerror=no;r.readAsArrayBuffer(file);});}).then(function(buf){
      var wb=window.XLSX.read(new Uint8Array(buf),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
      Object.keys(ws).forEach(function(k){ /* link da foto vindo como hiperlink ou fórmula IMAGE */
        var c=ws[k];if(k[0]==='!'||!c)return;var alvo='';
        if(c.l&&c.l.Target)alvo=c.l.Target;
        var m=c.f&&/IMAGE\(\s*"([^"]+)"/i.exec(c.f);if(m)alvo=m[1];
        if(alvo&&!/^https?:\/\//i.test(String(c.v==null?'':c.v))){c.t='s';c.v=alvo;delete c.w;}
      });
      fim(window.XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));
    }).catch(function(){toast('Não foi possível ler o Excel aqui. Salve a planilha como CSV e importe de novo.');});
  }else{
    var r=new FileReader();r.onload=function(){fim(parseCsv(r.result));};r.onerror=function(){toast('Não foi possível ler o arquivo.');};r.readAsText(file);
  }
}
function mapear(rows,defs){
  var head=rows[0].map(norm),idx={},usados={},achou=0;
  var temNumero=head.some(function(c){return c!==''&&/^[\d.,\s$r-]+$/.test(c)&&/\d/.test(c);}); /* linha com número é dado, não cabeçalho */
  if(!temNumero)defs.forEach(function(d){for(var j=0;j<head.length;j++){if(!usados[j]&&d.re.test(head[j])){idx[d.k]=j;usados[j]=1;achou++;break;}}});
  if(achou>=2){defs.forEach(function(d){if(idx[d.k]==null)idx[d.k]=-1;});return {idx:idx,rows:rows.slice(1)};}
  defs.forEach(function(d){idx[d.k]=d.pos;});
  return {idx:idx,rows:achou>=1?rows.slice(1):rows};
}
function cel(r,i){return i>=0&&r[i]!=null?String(r[i]).trim():'';}
var DEF_P=[{k:'sku',pos:0,re:/^(sku|cod|material|ean|item|ref)/},{k:'foto',pos:1,re:/(foto|imagem|image|img|url|link)/},{k:'preco',pos:2,re:/(preco|valor|price)/},{k:'nome',pos:3,re:/(nome|descr|produto)/}];
var DEF_L=[{k:'bcps',pos:0,re:/(bcps|^cod|^cp\b)/},{k:'gerente',pos:3,re:/(gerente|gestor|respons)/},{k:'praca',pos:2,re:/(praca|cidade|regi)/},{k:'loja',pos:1,re:/(loja|nome)/}];

}

function checaLanterna(){try{var st=$('#video').srcObject,tr=st&&st.getVideoTracks()[0],caps=tr&&tr.getCapabilities?tr.getCapabilities():{};$('#btnTorch').hidden=!caps.torch;}catch(e){}}
function abrirCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFalhou();return;}
  var video=$('#video');$('#cam').hidden=false;$('#camFlash').hidden=true;$('#btnTorch').hidden=true;torchOn=false;lendo=true;ultimo={c:'',t:0};
  $('#camTop').textContent=S.cfg.rapido?'Modo rápido: leia um produto depois do outro':'Aponte para o código de barras';camInfo();
  var nativo=('BarcodeDetector' in window)?window.BarcodeDetector.getSupportedFormats().catch(function(){return [];}):Promise.resolve([]);
  nativo.then(function(fmts){
    var quero=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar','qr_code'].filter(function(f){return fmts.indexOf(f)>=0;});
    if(quero.length){
      return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}).then(function(st){
        if(!lendo){st.getTracks().forEach(function(t){t.stop();});return;}

  pick:function(el){abrirItem(el.dataset.k);},
  pickNovo:function(){abrirItem($('#busca').value.trim());},
  editItem:function(el){var c=cupom();if(c)c.itens.forEach(function(i){if(i.id===el.dataset.id)abrirItem(i.codigo,i.id);});},
  chip:function(el){itemCtx.desconto=el.dataset.v;document.querySelectorAll('#chips button').forEach(function(b){b.setAttribute('aria-pressed',String(b===el));});},
  chipPag:function(el){finCtx.pag=finCtx.pag===el.dataset.v?'':el.dataset.v;document.querySelectorAll('#pchips button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===finCtx.pag));});$('#trocoBox').hidden=finCtx.pag!=='Dinheiro';},
  qtd:function(el){var f=$('#fQtd'),n=(parseInt(f.value,10)||1)+parseInt(el.dataset.d,10);f.value=Math.max(1,n);},
  salvarItem:function(){salvarItem(false);},
  salvarItemProx:function(){salvarItem(true);},
  removerItem:function(){var c=cupom();if(!c)return;c.itens=c.itens.filter(function(i){return i.id!==itemCtx.id;});save();closeSheet();render();toast('Item removido.');},
  fechar:closeSheet,
  finalizar:abrirFinalizar,
  confirmarFinal:confirmarFinal,
  concluirEdicao:function(){S.cupomId=null;save();location.hash='cupons';},
  cancelarCupom:function(){var c=cupom();if(!c)return;confirmar('Cancelar o cupom '+pad(c.num)+'?','O número continua reservado na sequência e o cupom sai dos totais. Dá para reativar depois.','Cancelar cupom',function(){c.status='cancelado';S.cupomId=null;save();render();toast('Cupom '+pad(c.num)+' cancelado.');});},
  reativar:function(){var c=cupom();if(!c)return;c.status='aberto';save();render();},
  confirmaSim:function(){var f=confirmCb;confirmCb=null;closeSheet();if(f)f();},
  abrirCupom:function(el){S.cupomId=el.dataset.id;save();location.hash='venda';},
  cliente:abrirCliente,
  salvarCliente:function(){var c=cupom();if(c&&lerCliente(c)){save();closeSheet();render();toast('Cliente salvo.');}},
  exportar:exportar,
  resumo:abrirResumo,
  copiarResumo:copiarResumo,
  enviarResumo:function(){var t=$('#resumoTxt').value;try{if(navigator.share){navigator.share({text:t}).catch(function(e){if(!e||e.name!=='AbortError')copiarResumo();});return;}}catch(e){}copiarResumo();},
  novaAcao:function(){formAcao(null);},
  editarAcao:function(){formAcao(acao());},
  salvarAcao:salvarAcao,
  excluirAcao:function(){var a=null;S.acoes.forEach(function(x){if(x.id===acaoEdit)a=x;});if(!a)return;confirmar('Excluir a ação “'+a.nome+'”?','Os '+a.cupons.length+' cupons desta ação serão apagados deste aparelho. Exporte antes se ainda precisar deles.','Excluir ação',function(){S.acoes=S.acoes.filter(function(x){return x.id!==a.id;});if(S.acaoId===a.id){S.acaoId=S.acoes.length?S.acoes[S.acoes.length-1].id:null;S.cupomId=null;}save();render();toast('Ação excluída.');});},
  trocarAcao:function(el){S.acaoId=el.dataset.id;S.cupomId=null;save();render();window.scrollTo(0,0);},
  impProdutos:function(){$('#fileProdutos').click();},
  impLojas:function(){$('#fileLojas').click();},
  modeloProdutos:function(){baixar('modelo_produtos.csv','\uFEFFsku;foto;preco;nome\r\n12345;https://exemplo.com/fotos/12345.jpg;59,90;Nome do produto\r\n');},
  modeloLojas:function(){baixar('modelo_lojas.csv','\uFEFFbcps;loja;praca;gerente\r\n1234;Nome da loja;Nome da praça;Nome do gerente\r\n');},
  baixarFotos:baixarFotos,
  logo:function(){$('#fileLogo').click();},
  logoRemover:function(){LOGO='';try{localStorage.removeItem(KEY_LOGO);}catch(e){}render();}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&!el.disabled&&A[el.dataset.act]){acordado();A[el.dataset.act](el);}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='busca'){var v=e.target.value.trim();if(!v)return;var pr=document.querySelector('#res [data-act="pick"]');if(/^\d+$/.test(v)||!pr)abrirItem(v);else abrirItem(pr.dataset.k);}
});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();
</script>
</body>
</html>
